version: v2
modules:
  - path: proto/adcom/proto
    lint:
      use:
        - MINIMAL
  - path: proto/openrtb/proto
    lint:
      use:
        - MINIMAL
  - path: proto/proto
    lint:
      use:
        - STANDARD
      except:
        - RPC_REQUEST_STANDARD_NAME
        - RPC_RESPONSE_STANDARD_NAME
        - RPC_REQUEST_RESPONSE_UNIQUE
  - path: schemas/proto
