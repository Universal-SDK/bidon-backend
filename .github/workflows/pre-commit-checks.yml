name: Pre-commit Checks

on:
  workflow_call:
  push:
    branches:
      - "main"

jobs:
    pre-commit:
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v7
          with:
            ref: ${{ github.head_ref || github.sha }}
            fetch-depth: 0

        - name: Run pre-commit checks
          run: docker compose run --rm go-pre-commit
