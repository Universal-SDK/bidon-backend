services:
  migrate-test:
    image: golang:1.24-alpine
    volumes:
      - .:/app
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build
    working_dir: /app
    command: go run ./cmd/bidon-migrate up
    depends_on:
      - postgres-test
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgres://bidon:pass@postgres-test:5432/bidon_test
      DATABASE_REPLICA_URL: postgres://bidon:pass@postgres-test:5432/bidon_test

  go-test:
    profiles: ['test']
    image: golang:1.24-alpine
    volumes:
      - .:/app
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build
    working_dir: /app
    entrypoint: ["go", "test"]
    command: ./...
    depends_on:
      migrate-test:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://bidon:pass@postgres-test:5432/bidon_test
      DATABASE_REPLICA_URL: postgres://bidon:pass@postgres-test:5432/bidon_test

  go-pre-commit:
    image: golang:1.24-alpine
    volumes:
      - .:/app
      - gomodcache-precommit:/go/pkg/mod
      - gocache-precommit:/root/.cache/go-build
      - precommit-tools:/go/precommit-tools
    working_dir: /app
    entrypoint: ["/bin/sh", "/app/docker/pre-commit/entrypoint.sh"]
    environment:
      PRECOMMIT_TOOLS_DIR: /go/precommit-tools
    networks:
      - precommit-network

  postgres-test:
    image: postgres:17-alpine
    ports:
      - '5435:5432'
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: bidon_test
      POSTGRES_USER: bidon
      POSTGRES_PASSWORD: pass
    healthcheck:
      test: pg_isready -U bidon -d bidon_test
      interval: 5s

  redis:
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  copilot-postgres:
    image: postgres:17-alpine
    profiles: ['copilot']
    ports:
        - "5433:5432"
    environment:
        POSTGRES_DB: postgres
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
    volumes:
        - copilot-pgdata:/var/lib/postgresql/data
    healthcheck:
        test: pg_isready -U postgres
        interval: 5s
  
  copilot-api:
    image: copilot
    profiles: ['copilot']
    ports:
      - "8123:8000"
    depends_on:
      copilot-postgres:
          condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./copilot/.env
    environment:
      REDIS_URI: redis://redis:6379
      REDIS_CLUSTER: False
      REDIS_KEY_PREFIX: "copilot:"
      DATABASE_URI: postgres://postgres:postgres@copilot-postgres:5432/postgres?sslmode=disable

  rust-test:
    profiles: ['test']
    build:
      context: .
      target: proxy-builder
    volumes:
      - .:/proxy/src
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/proxy/src/target
    working_dir: /proxy/src
    command: cargo test --all-features

volumes:
  pgdata-test:
  gomodcache:
  gocache:
  gomodcache-precommit:
  gocache-precommit:
  precommit-tools:
  cargo-cache:
  target-cache:
  copilot-pgdata:

networks:
  precommit-network:
